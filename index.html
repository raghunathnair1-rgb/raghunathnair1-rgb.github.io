  <script>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ndensed',sans-serif;text-transform:uppercase;font-weight:600;font-size:11.5px;color:#767d74;letter-spacing:0.14em\">MOVEMENT LAB<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:2px\">\n      <sc-for list=\"{{ nav }}\" as=\"item\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-click=\"{{ item.go }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500;color:{{ item.fg }};background:{{ item.bg }}\" style-hover=\"background:#151815;color:#e9ece8\">\n          <span>{{ item.label }}<\u002Fspan>\n          <span style=\"font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:600;font-size:12px;color:{{ item.tagFg }}\">{{ item.tag }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"border:1px solid #1c201c;border-radius:10px;padding:12px\">\n        <div style=\"font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:600;font-size:11.5px;color:#767d74;letter-spacing:0.14em;margin-bottom:8px\">CALIBRATION<\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:6px\">\n          <div style=\"font-size:22px;font-weight:700;letter-spacing:-0.03em\">98.2<\u002Fdiv>\n          <div style=\"font-size:11px;color:#767d74\">%<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:3px;background:#1c201c;border-radius:2px;margin-top:8px;overflow:hidden\">\n          <div style=\"width:98%;height:100%;background:#5fe08f\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <div style=\"width:28px;height:28px;border-radius:50%;background:#1c201c;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#a8b0a6\">{{ initials }}<\u002Fdiv>\n        <div style=\"min-width:0\">\n          <div style=\"font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ athlete }}<\u002Fdiv>\n          <div style=\"font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:600;font-size:11.5px;color:#767d74\">{{ tierLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <main style=\"flex:1;min-width:0;padding:32px 34px 56px;max-width:1500px\">\n\n    <header style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid #1c201c;margin-bottom:22px\">\n      <div style=\"min-width:0\">\n        <div style=\"font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:600;font-size:12px;color:#767d74;letter-spacing:0.16em;margin-bottom:7px\">{{ crumb }}<\u002Fdiv>\n        <h1 style=\"margin:0;font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:700;text-transform:uppercase;letter-spacing:0.005em;line-height:1.05;text-wrap:pretty\">{{ title }}<\u002Fh1>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n        <div style=\"display:flex;align-items:center;gap:7px;border:1px solid #1c201c;border-radius:999px;padding:7px 13px\">\n          <div style=\"width:6px;height:6px;border-radius:50%;background:{{ statusDot }};animation:blink 1.6s infinite\"><\u002Fdiv>\n          <span style=\"font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:600;font-size:12.5px;color:#a8b0a6;letter-spacing:0.1em\">{{ statusText }}<\u002Fspan>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ toggleRun }}\" style=\"cursor:pointer;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:600;background:{{ ctaBg }};color:{{ ctaFg }};border:1px solid {{ ctaBorder }}\" style-hover=\"filter:brightness(1.12)\">{{ ctaLabel }}<\u002Fdiv ase;font-weight:600;font-size:11.5px;color:#767d74;letter-spacing:0.14em\">SESSION SCORE<\u002Fdiv>\n              <div style=\"display:flex;align-items:baseline;gap:10px;margin-top:8px\">\n                <div style=\"font-family:'Barlow Condensed',sans-serif;font-size:84px;font-weight:700;letter-spacing:0;line-height:.85;color:{{ accentColor }}\">{{ sessionScore }}<\u002Fdiv>\n                <div style=\"font-size:20px;font-weight:600;color:#767d74\">/ 100<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:13px;color:#8d958b;line-height:1.55;text-wrap:pretty\">{{ reportSummary }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ reportStats }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"border:1px solid #1c201c;border-radius:14px;padding:18px\">\n              <div style=\"font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:600;font-size:11.5px;color:#767d74;letter-spacing:0.14em\">{{ s.label }}<\u002Fdiv>\n              <div style=\"font-family:'Barlow Condensed',sans-serif;font-size:35px;font-weight:700;letter-spacing:0;margin-top:9px\">{{ s.value }}<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#767d74;margin-top:5px;line-height:1.45\">{{ s.note }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #1c201c;border-radius:14px;padding:18px 20px\">\n          <div style=\"font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:600;font-size:12px;color:#767d74;letter-spacing:0.16em;margin-bottom:16px\">FIX LIST · NEXT SESSION<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:13px\">\n            <sc-for list=\"{{ fixList }}\" as=\"f\" hint-placeholder-count=\"3\">\n              <div style=\"display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;align-items:start;padding-bottom:13px;border-bottom:1px solid #151815\">\n                <div style=\"font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:600;font-size:13.5px;color:#5e655d;padding-top:2px\">{{ f.n }}<\u002Fdiv>\n                <div style=\"min-width:0\">\n                  <div style=\"font-size:13.5px;font-weight:600\">{{ f.title }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:#8d958b;line-height:1.5;margin-top:3px;text-wrap:pretty\">{{ f.body }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#5fe08f&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#5fe08f&quot;,&quot;#f4622e&quot;,&quot;#5b8cff&quot;,&quot;#e5c100&quot;],&quot;section&quot;:&quot;Look&quot;},&quot;athleteName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Mara Ellis&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Athlete&quot;},&quot;repTarget&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:12,&quot;min&quot;:4,&quot;max&quot;:30,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Session&quot;},&quot;strictMode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Session&quot;}}\">\nclass Component extends DCLogic {\n  state = { view: 'session', running: false, t: 0, reps: [], cues: [] };\n\n  MOVES = [\n    { name: 'Pull-up', tier: 'INTERMEDIATE', form: 91, rom: '96%', tempo: '2.1s', symm: '94%', grade: 'A-', mastery: '82%' },\n    { name: 'Push-up', tier: 'FOUNDATION', form: 95, rom: '98%', tempo: '1.9s', symm: '97%', grade: 'A', mastery: '94%' },\n    { name: 'Dip', tier: 'FOUNDATION', form: 88, rom: '91%', tempo: '2.4s', symm: '90%', grade: 'B+', mastery: '76%' },\n    { name: 'Pistol squat', tier: 'INTERMEDIATE', form: 74, rom: '82%', tempo: '3.0s', symm: '71%', grade: 'C', mastery: '48%' },\n    { name: 'L-sit', tier: 'INTERMEDIATE', form: 83, rom: '88%', tempo: '—', symm: '86%', grade: 'B', mastery: '61%' },\n    { name: 'Handstand', tier: 'ADVANCED', form: 69, rom: '74%', tempo: '—', symm: '64%', grade: 'C-', mastery: '35%' },\n    { name: 'Muscle-up', tier: 'ADVANCED', form: 77, rom: '85%', tempo: '1.6s', symm: '79%', grade: 'B-', mastery: '44%' },\n    { name: 'Front lever', tier: 'ELITE', form: 58, rom: '63%', tempo: '—', symm: '57%', grade: 'D+', mastery: '21%' }\n  ];\n\n  componentDidMount() {\n    this.iv = setInterval(() => {\n      if (!this.state.running) return;\n      this.setState(s => {\n        const t = s.t + 1;\n        let reps = s.reps, cues = s.cues;\n        if (t % 26 === 0) {\n          const score = Math.round(76 + 20 * Math.abs(Math.sin(t / 31 + 1.2)));\n          reps = [...s.reps, { n: reps.length + 1, score }];\n          cues = [this.cueFor(score, reps.length), ...s.cues].slice(0, 5);\n        }\n        return { t, reps, cues };\n      });\n    }, 95);\n  }\n  componentWillUnmount() { clearInterval(this.iv); }\n\n  get accent() { return this.props.accentColor || '#5fe08f'; }\n  get warn() { return '#e8b13a'; }\n  get bad() { return '#ef6a5a'; }\n  get strict() { return this.props.strictMode ?? false; }\n  get bar() { return this.strict ? 90 : 84; }\n\n  tone(v) { return v >= this.bar ? this.accent : v >= this.bar - 10 ? this.warn : this.bad; }\n\n  cueFor(score, n) {\n    const lib = [\n      { head: 'Elbow flare on the pull', body: 'Right elbow drifted 11° wide at mid-range. Drive the shoulder blade down first.' },\n      { head: 'Clean rep', body: 'Full range, even bar path, scapula engaged before the arms.' },\n      { head: 'Tempo collapsed', body: 'Eccentric dropped to 0.7s. Target a 2s lower to keep tension.' },\n      { head: 'Hip sway detected', body: 'Pelvis rotated 6° left. Squeeze glutes to lock the line.' },\n      { head: 'Range cut short', body: 'Chin stopped 4cm below the bar. Finish the rep at the top.' }\n    ];\n    const pick = score >= this.bar ? lib[1] : lib[(n + score) % lib.length];\n    return { head: 'Rep ' + n + ' · ' + pick.head, body: pick.body, color: this.tone(score) };\n  }\n\n  renderVals() {\n    const { view, running, t, reps, cues } = this.state;\n    const A = this.accent, W = this.warn, B = this.bad;\n    const target = this.props.repTarget ?? 12;\n    const go = v => () => this.setState({ view: v });\n    const phase = (t % 26) / 26;\n    const live = reps.length ? reps[reps.length - 1].score : 88;\n    const acc = running ? Math.round(live * 0.7 + (82 + 12 * Math.sin(t / 17)) * 0.3) : (reps.length ? Math.round(reps.reduce((a, r) => a + r.score, 0) / reps.length) : 88);\n\n    const navDefs = [\n      ['session', 'Live session', running ? 'REC' : 'IDLE'],\n      ['dashboard', 'Dashboard', '12W'],\n      ['library', 'Move library', '8'],\n      ['report', 'Session report', reps.length ? String(reps.length) : '—']\n    ];\n\n    const jointDefs = [\n      ['Shoulder L', 3, 14, 26], ['Shoulder R', 11, 30, 26], ['Elbow L', 5, 12, 44],\n      ['Elbow R', 9, 32, 44], ['Spine', 4, 22, 38], ['Hip line', 7, 22, 58],\n      ['Knee L', 2, 17, 80], ['Knee R', 3, 27, 80], ['Scapula', 6, 22, 22]\n    ];\n    const bob = running ? Math.sin(phase * Math.PI * 2) * 5 : 0;\n\n    const cueList = cues.length ? cues : [{ head: 'Awaiting first rep', body: 'Step into frame and begin. Scoring starts on the first detected concentric.', color: '#767d74' }];\n\n    return {\n      accentColor: A,\n      athlete: this.props.athleteName || 'Mara Ellis',\n      initials: (this.props.athleteName || 'Mara Ellis').split(' ').map(w => w[0]).join('').slice(0, 2),\n      tierLabel: this.strict ? 'STRICT · COACH MODE' : 'INTERMEDIATE · WK 14',\n\n      isSession: view === 'session', isDash: view === 'dashboard', isLib: view === 'library', isReport: view === 'report',\n      nav: navDefs.map(([v, label, tag]) => ({\n        label, tag, go: go(v),\n        fg: view === v ? '#e9ece8' : '#8d958b',\n        bg: view === v ? '#151815' : 'transparent',\n        tagFg: v === 'session' && running ? B : '#5e655d'\n      })),\n\n      crumb: { session: 'LIVE CAPTURE / VISION MODEL v4.2', dashboard: 'PROGRESS / 12 WEEK WINDOW', library: 'CATALOGUE / 8 TRACKED MOVES', report: 'REPORT / SESSION 041' }[view],\n      title: { session: 'Movement accuracy, live', dashboard: 'Where your form is going', library: 'Every move, graded', report: 'Session 041 breakdown' }[view],\n\n      statusDot: running ? B : '#5e655d',\n      statusText: running ? 'CAPTURING · 9 JOINTS LOCKED' : 'CAMERA READY',\n      ctaLabel: running ? 'End session' : reps.length ? 'Resume capture' : 'Start capture',\n      ctaBg: running ? 'transparent' : A,\n      ctaFg: running ? '#e9ece8' : '#0a0b0a',\n      ctaBorder: running ? '#334034' : A,\n      toggleRun: () => this.setState(s => ({ running: !s.running, view: s.running ? 'report' : 'session' })),\n\n      moveName: 'Pull-up · strict',\n      phaseLabel: running ? (phase < 0.45 ? 'CONCENTRIC — ' + Math.round(phase * 222) + '% ROM' : phase < 0.55 ? 'TOP HOLD' : 'ECCENTRIC — 2.0s TARGET') : 'STANDBY',\n      phaseColor: running ? A : '#5e655d',\n      focusX: (22 + bob * 0.3) + '%', focusY: (30 + bob) + '%', focusColor: this.tone(acc),\n\n      joints: jointDefs.map(([name, dev, x, y]) => ({\n        x: (x + bob * 0.25) + '%', y: (y + bob * (y > 50 ? 0.3 : 1)) + '%',\n        size: dev > 8 ? '11px' : '9px',\n        color: dev > 8 ? B : dev > 5 ? W : A,\n        halo: (dev > 8 ? B : dev > 5 ? W : A) + '26'\n      })),\n      jointRows: jointDefs.map(([name, dev]) => {\n        const d = running ? Math.max(1, dev + Math.round(2 * Math.sin(t / 9 + dev))) : dev;\n        return { name, dev: d + '°', pct: Math.min(100, d * 9) + '%', color: d > 8 ? B : d > 5 ? W : A };\n      }),\n\n      liveChips: [\n        { label: 'REPS', value: reps.length + '/' + target, color: '#e9ece8' },\n        { label: 'TEMPO', value: running ? (1.7 + 0.5 * Math.abs(Math.sin(t / 23))).toFixed(1) + 's' : '—', color: '#e9ece8' },\n        { label: 'SYMMETRY', value: (running ? 88 + Math.round(8 * Math.abs(Math.cos(t / 19))) : 92) + '%', color: this.tone(acc) }\n      ],\n\n      accuracy: acc,\n      accDeg: Math.round(acc * 3.6) + 'deg',\n      verdict: acc >= this.bar ? 'Form holding inside tolerance' : acc >= this.bar - 10 ? 'Drifting — correctable' : 'Breakdown detected',\n      verdictColor: this.tone(acc),\n      verdictNote: acc >= this.bar\n        ? 'Bar path deviation under 2cm across the last three reps. Keep this tempo.'\n        : 'Right elbow and hip line are the two contributors. Cut the set at the first missed rep.',\n      miniStats: [\n        { label: 'RANGE OF MOTION', value: (running ? 88 + Math.round(9 * Math.abs(Math.sin(t / 13))) : 96) + '%' },\n        { label: 'TIME UNDER TENSION', value: Math.round(reps.length * 4.1) + 's' }\n      ],\n\n      repProgress: reps.length + ' OF ' + target + ' REPS · BAR ' + this.bar,\n      repBars: (reps.length ? reps : Array.from({ length: 12 }, (_, i) => ({ n: i + 1, score: 0 }))).slice(-14).map(r => ({\n        n: r.n, h: r.score ? Math.max(6, r.score * 0.9) + '%' : '4%',\n        color: r.score ? this.tone(r.score) : '#161a16'\n      })),\n      cues: cueList,\n\n      tiles: [\n        { label: 'MEAN FORM SCORE', value: '89.4', delta: '+2.1', deltaColor: A, note: 'Across 41 tracked sessions' },\n        { label: 'CLEAN REP RATE', value: '78%', delta: '+11', deltaColor: A, note: 'Reps inside full tolerance' },\n        { label: 'SYMMETRY GAP', value: '6.2%', delta: '−1.4', deltaColor: A, note: 'Left side still dominant' },\n        { label: 'STREAK', value: '23', delta: 'days', deltaColor: '#767d74', note: 'Longest run to date' }\n      ],\n      trend: [78, 80, 79, 83, 82, 86, 84, 88, 87, 90, 89, 92].map((v, i) => ({\n        label: 'W' + (i + 1), h: (v - 60) * 2.4 + '%',\n        color: i === 11 ? A : v >= 86 ? A + 'cc' : '#2a332b'\n      })),\n      weakPoints: [\n        { score: '71', title: 'Right elbow flare under load', color: W, body: 'Appears on rep 6 onward in pull-ups and muscle-ups. Scapular retraction is late by ~0.3s.' },\n        { score: '64', title: 'Pistol squat knee tracking', color: B, body: 'Knee collapses 9° medial at the bottom. Add tempo eccentrics and ankle mobility work.' },\n        { score: '83', title: 'Handstand line drift', color: W, body: 'Ribs flare as hold passes 12s. Shorten holds, prioritise hollow position.' }\n      ],\n      moveRows: this.MOVES.map(m => ({\n        ...m, go: () => this.setState({ view: 'session' }),\n        form: m.form + '%', formColor: this.tone(m.form),\n        gradeColor: m.form >= 88 ? A : m.form >= 74 ? W : B\n      })),\n      library: this.MOVES.map(m => ({\n        name: m.name, tier: m.tier, grade: m.grade, mastery: m.mastery,\n        slot: m.name.toUpperCase() + ' REFERENCE CLIP',\n        border: '#1c201c',\n        gradeColor: m.form >= 88 ? A : m.form >= 74 ? W : B,\n        go: () => this.setState({ view: 'session' })\n      })),\n\n      sessionScore: reps.length ? Math.round(reps.reduce((a, r) => a + r.score, 0) / reps.length) : 88,\n      reportSummary: reps.length\n        ? reps.length + ' reps captured. ' + reps.filter(r => r.score >= this.bar).length + ' cleared the ' + this.bar + '-point bar. Form held for the first two thirds of the set, then elbow flare returned under fatigue.'\n        : 'No reps captured yet — start a capture session to generate a breakdown.',\n      reportStats: [\n        { label: 'CLEAN REPS', value: reps.filter(r => r.score >= this.bar).length + '/' + (reps.length || 0), note: 'Inside full tolerance band' },\n        { label: 'BEST REP', value: reps.length ? Math.max(...reps.map(r => r.score)) : '—', note: 'Rep 3 · bar path deviation 0.8cm' },\n        { label: 'FATIGUE ONSET', value: reps.length > 5 ? 'Rep 6' : '—', note: 'First sustained score drop' }\n      ],\n      fixList: [\n        { n: '01', title: 'Lead with the scapula', body: 'Three sets of 8 scap pulls before every pulling session. Target retraction 0.3s before elbow flexion.' },\n        { n: '02', title: 'Cap the set at the first flare', body: 'Quality over volume: end the set the rep after deviation crosses 8°.' },\n        { n: '03', title: 'Tempo eccentrics', body: 'Two 4-second lowers per set to rebuild control through the bottom third of the range.' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

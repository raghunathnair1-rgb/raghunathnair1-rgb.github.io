name: Deploy Next.js site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Latest-wins: cancel any in-progress run when a newer commit arrives. Safe here because
# telemetry commits STACK on top of code commits, so the NEWEST commit always contains all
# content — a cancelled build's changes still ship via the next build. 'false' (queue) caused
# thrashing: with a 5-min telemetry cron flooding the group, pending runs kept getting
# superseded and nothing deployed. Builds finish in ~90s, well inside the cron gap.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + format gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  build:
    name: Build + browser tests + static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Cache the Playwright browser across runs so the ~150 MB chromium download
      # only happens when the @playwright/test version changes.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      # Server build (also serves the Playwright webServer) and the static export.
      - run: npm run build
      # Browser tests are a blocking gate: a broken UI never ships.
      - run: npm test
      - run: npm run build:static
      - name: Preserve existing published routes and assets
        run: cp -R styles.css assets status.json news.json dmesg.json spark.json router.json deploy.json activity.json watchdog.json coverage.json brain.json ontology.json ideas.json wx.json p feed kb sitemap.xml rss.xml atom.xml feed.json robots.txt out/
      # Size gate: fail loudly if the Pages artifact balloons (assets/content creep).
      # du -sk (KB) — `du -sb` is a GNU-ism that fails on macOS.
      # Baseline is ~11 MB (kb/ 5.8 MB + assets 0.7 MB + ontology 0.4 MB + app ~1 MB);
      # 15 MB leaves headroom for growth while still catching runaway bloat.
      - name: Artifact size gate
        run: |
          LIMIT=$((15 * 1024))
          SIZE=$(du -sk out | cut -f1)
          echo "Pages artifact size: $SIZE KB (limit: $LIMIT KB)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "❌ artifact exceeds $((LIMIT / 1024)) MB limit"
            du -sk out/* | sort -rn | head -20
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: [quality, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

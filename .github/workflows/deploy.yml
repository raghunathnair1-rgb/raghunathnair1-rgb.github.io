name: Deploy Next.js site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Latest-wins: cancel any in-progress run when a newer commit arrives. Safe here because
# telemetry commits STACK on top of code commits, so the NEWEST commit always contains all
# content — a cancelled build's changes still ship via the next build. 'false' (queue) caused
# thrashing: with a 5-min telemetry cron flooding the group, pending runs kept getting
# superseded and nothing deployed. Builds finish in ~90s, well inside the cron gap.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  coverage:
    name: 100% coverage gate (blog-logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Gate ONLY the pure-logic crate at 100% lines. It has no web deps, so it builds and
      # tests on the native host (no wasm target / browser needed). A drop below 100% fails
      # this job, which blocks `build` (needs: coverage) and therefore the deploy.
      - name: cargo llvm-cov — fail under 100% lines
        run: cargo llvm-cov -p blog-logic --lib --fail-under-lines 100 --summary-only --locked

  build:
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build:static
      - name: Preserve existing published routes and assets
        run: cp -R styles.css assets status.json news.json dmesg.json spark.json router.json deploy.json activity.json watchdog.json coverage.json brain.json ontology.json ideas.json wx.json p feed kb sitemap.xml rss.xml atom.xml feed.json robots.txt out/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
